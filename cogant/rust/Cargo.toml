[workspace]
members = [
    "cogant-core",
    "cogant-graph",
    "cogant-translate",
    "cogant-statespace",
    "cogant-store",
    "cogant-trace",
    "cogant-gnn",
    "cogant-ffi",
]

resolver = "2"

[workspace.package]
# Intentional independent versioning: the Rust crates version separately from
# the Python package (`cogant.__version__`, currently 0.6.0). 0.1.0 reflects the
# Rust workspace's own maturity and the distributed `cogant_rust-0.1.0` wheel;
# this decoupling is deliberate, not drift.
version = "0.1.0"
edition = "2024"
authors = ["COGANT Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ActiveInferenceInstitute/COGANT"
homepage = "https://github.com/ActiveInferenceInstitute/COGANT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
petgraph = { version = "0.8.3", features = ["serde-1"] }
pyo3 = { version = "0.29.3" }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
