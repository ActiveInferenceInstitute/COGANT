# Pre-commit hooks for the COGANT package.
#
# Install with:
#     pre-commit install
#
# Run against all files manually with:
#     pre-commit run --all-files
#
# See: https://pre-commit.com

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pinned in uv.lock (CI's ``uv run ruff``).
    rev: v0.17.0
    hooks:
      # Lint+format only the package and test trees so the hook matches the
      # CI ratchet (.github/workflows/ci.yml :: Lint (ruff)). Auxiliary
      # scripts under tools/, scripts/, manuscript/, etc. are intentionally
      # not policed by pre-commit yet — see CONTRIBUTING.md "Lint scope".
      # NOTE: pre-commit always matches ``files`` against paths relative to
      # the git repo root (COGANT/), regardless of the cwd the command was
      # invoked from, so the ``cogant/`` prefix is required. A bare
      # ``tests/`` alternative would also sweep the repo-root ``tests/``
      # tree (tools audit tests) which is NOT covered by the CI ruff
      # ratchet and formats under a different ruff config — on CI that made
      # this hook rewrite 24 files and fail every run.
      # ``ruff-check`` is the canonical id; upstream keeps ``ruff`` only as a
      # legacy alias.
      - id: ruff-check
        args: [--fix]
        files: ^cogant/(py/cogant|tests)/
      # Since ruff-pre-commit v0.16.5 this hook also receives Markdown files
      # (Python code fences in AGENTS.md/README.md under these trees). That
      # matches CI: ruff 0.17's ``ruff format --check py/cogant/ tests/``
      # discovers the same Markdown files, and both read cogant/pyproject.toml.
      - id: ruff-format
        files: ^cogant/(py/cogant|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      # pre-commit runs hooks from the git root (COGANT/) and matches ``files``
      # against root-relative paths, so both the entry and the pattern are
      # anchored there. CI skips this hook (SKIP=metrics-freshness): the
      # pre-commit job has no uv, and the lint job already enforces the gate.
      - id: metrics-freshness
        name: METRICS.yaml freshness
        entry: uv run --directory cogant python ../tools/check_metrics_fresh.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^cogant/evaluation/METRICS\.yaml$
