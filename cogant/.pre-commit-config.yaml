# Pre-commit hooks for the COGANT package.
#
# Install with:
#     pre-commit install
#
# Run against all files manually with:
#     pre-commit run --all-files
#
# Ruff is NOT a hook here: `python run_gate.py lint` is the single ruff
# invocation shared by CI and local runs, so a commit cannot be linted twice
# with two different configurations. These hooks cover the file hygiene no
# gate arm covers.
#
# See: https://pre-commit.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      # pre-commit runs hooks from the git root (COGANT/) and matches ``files``
      # against root-relative paths, so both the entry and the pattern are
      # anchored there. CI skips this hook (SKIP=metrics-freshness): the
      # pre-commit job has no uv, and `run_gate.py content` enforces the gate.
      - id: metrics-freshness
        name: METRICS.yaml freshness
        entry: uv run --directory cogant python ../tools/check_metrics_fresh.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^cogant/evaluation/METRICS\.yaml$
