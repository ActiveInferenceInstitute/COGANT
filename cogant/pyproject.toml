[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogant"
version = "0.6.0"
description = "Codebase-to-GNN Translation Engine: translate software repositories into Generalized Notation Notation (Active Inference Institute) state-space and process-model representations"
authors = [
    {name = "COGANT Contributors", email = "contributors@cogant.dev"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["code analysis", "generalized notation notation", "active inference", "program synthesis", "codebase analysis", "state-space model"]
classifiers = [
    # Beta reflects the current documented feature set; release checks are
    # enforced by the clean-wheel and end-to-end CI jobs.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

# Floors track the versions the lockfile resolves and CI tests (raised in the
# 0.7.0 dependency refresh); `uv lock --upgrade` moves the lock, and floors
# follow when a release starts depending on newer behaviour.
dependencies = [
    "pydantic>=2.14",
    "typer>=0.27",
    "rich>=15.0",
    "networkx>=3.6",
    "pyarrow>=26.0",
    "fastapi>=0.143",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "hypothesis>=6.169",
    # HTTP clients for server tests only (no package module imports httpx):
    # httpx drives ASGITransport tests; Starlette's TestClient prefers httpx2.
    "httpx>=0.28",
    "httpx2>=2.13",
]
viz = [
    "plotly>=7.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11",
]
multilang = [
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
]
analytics = [
    "duckdb>=1.5",
]
# ASGI server for `cogant.server.app` (the Docker image's CMD runs uvicorn).
server = [
    "uvicorn[standard]>=0.54",
]
upstream = [
    # GNN 4.1.0 release line: main@b4a583a5 (2026-10-14), 12 commits past the
    # v4.1.0 tag (9255e19f). GNN >= 4.0 ships the top-level ``gnn`` package;
    # tools/gnn_upstream_audit_surface.py and tools/audit_release_integrity.py
    # check this pin against uv.lock.
    "generalized-notation-notation @ git+https://github.com/ActiveInferenceInstitute/Generalized_Notation_Notation.git@b4a583a5851021612a9a5df94e428f78aa6f76a0",
]
all = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "httpx>=0.28",
    "httpx2>=2.13",
    "plotly>=7.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "duckdb>=1.5",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
cogant = "cogant.cli.main:app"

[tool.setuptools]
package-dir = {"" = "py"}

[tool.setuptools.packages]
find = {where = ["py"]}

[tool.setuptools.package-data]
cogant = ["py.typed", "**/*.pyi", "**/*.json", "**/*.md"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=py/cogant",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    # Line total is computed to ~89.9–90.0%; the terminal table rounds to 90%.
    "--cov-fail-under=89",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_rust: Tests that require Rust bindings",
    "fuzz: Hypothesis-based fuzz / property tests",
    "property: Hypothesis property-based correctness law tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "examples/real_world/json_stdlib",
    "_extensions",
]

[tool.ruff.lint]
# Explicit ``select`` (not ``extend-select``): ruff 0.17 broadened its default
# rule set (171 -> 446 enabled rules), so extending the implicit default would
# silently change the lint contract on every ruff upgrade. This list is the
# full enabled set; widen it deliberately, rule family by rule family.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
extend-ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Typer CLI modules intentionally use typer.Argument/typer.Option as defaults;
# that is the canonical Typer pattern and is safe (the callables produce
# parameter-info objects, not shared mutable state).
"py/cogant/cli/*.py" = ["B008"]
"py/cogant/reverse/cli.py" = ["B008"]
# Test files use sys.path manipulation before imports for editable-install fallback;
# E402 (module-level import not at top) is expected and intentional there.
"tests/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cogant"]
known-third-party = ["pydantic", "typer", "rich", "networkx", "pyarrow", "duckdb"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
# The pydantic v2 mypy plugin gives BaseModel a real type (without it,
# BaseModel resolves to Any and every cogant.config/*.pyi + schemas/*.pyi
# class declaration fails strict-mode subclass checks).
plugins = ["pydantic.mypy"]
# The per-module overrides below are deliberately defensive — they
# guard against optional-dependency absence on minimal installs and
# against ``mypy .`` invocations that visit ``tests/``. When run only
# against ``py/cogant/`` mypy will print "unused section(s)" notes for
# overrides that did not fire; suppress that with
# ``--no-warn-unused-configs`` (CI does this; ``strict = true`` here
# leaves the rest of the strict bundle on).
warn_unused_configs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Tests intentionally use looser typing than the runtime package.
# ``strict`` is enforced on ``py/cogant/`` only; this override stops
# mypy from re-analysing the test tree when invoked repo-wide.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Optional / native-extension imports that mypy may not be able to
# resolve when the dev extras are not installed. Modules listed here
# have either no PEP 561 stubs (matplotlib, the native ``cogant._rust``
# extension) or are guarded behind ``try: import ...`` blocks in the
# package. Keep the list short — entries that mypy reports as "unused
# section" should be pruned promptly to keep this file honest.
[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "networkx.*",
    "numpy.*",
    "cogant._rust",
    # PyYAML ships no type stubs by default and pulling types-PyYAML
    # only for one line of `ablation_view.py` is more weight than the
    # signal. yaml usage here is dynamic-config glue, not type-load-bearing.
    "yaml",
]
ignore_missing_imports = true

# The optional upstream package has no bundled typing metadata and is loaded
# only by the explicit upstream validation path.
[[tool.mypy.overrides]]
module = ["gnn", "gnn.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Line coverage is the gate (see --cov-fail-under). Branch tracking stays useful in
# HTML reports but was tuned with line targets; combined line+branch totals sit ~2%
# below line-only on this codebase.
branch = false
parallel = true
source = ["py/cogant"]
# Tree-sitter front end is the only path excluded from the line-coverage gate.
# Rationale: it is an optional dependency (the ``multilang`` extra), the bundled
# JS/TS test fixtures exercise it via the broader pipeline (parser smoke tests
# + roundtrip golden), and the file is mostly grammar plumbing whose
# line-by-line coverage swings with tree-sitter version bumps. ``cogant/tools/``
# is now in the gate (see ``tests/unit/tools/test_tools_smoke.py``).
omit = [
    "*/cogant/static/treesitter_parser.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mutmut]
paths_to_mutate = ["py/cogant/translate/engine.py", "py/cogant/markov/blanket.py"]
tests_dir = [
    "tests/unit/test_markov.py",
    "tests/unit/test_mutation_hardening.py",
    "tests/unit/test_mutation_regressions_engine_matrices_statespace.py",
    "tests/unit/test_observation_rule_tutorial.py",
    "tests/unit/test_rule_classes.py",
    "tests/unit/test_rule_dsl.py",
    "tests/unit/test_translate_rules_behavioral.py",
    "tests/unit/test_translation_rules.py",
    "tests/unit/test_translate_markov_mutation_regression.py",
]
pytest_add_cli_args = ["-x", "-q", "--no-header", "--no-cov", "-p", "no:cacheprovider", "-o", "addopts="]

[dependency-groups]
dev = [
    "hypothesis>=6.169",
    "mutmut>=3.8",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "pytest-cov>=7.1",
    "mypy>=2.4",
]
