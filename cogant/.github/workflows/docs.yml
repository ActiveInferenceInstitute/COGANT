# Build and deploy the MkDocs site. Repository root must be the COGANT package root
# (directory containing mkdocs.yml and docs/). For a monorepo, add working-directory.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Action versions track ../../../.github/workflows/AGENTS.md. Every action is
# pinned to a full commit SHA with its resolved release in a trailing comment.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true
      - name: Build site
        run: uv run --with mkdocs-material --with 'mkdocstrings[python]' mkdocs build
      # upload-pages-artifact v4+ leaves dotfiles out of the Pages tarball by
      # default; the MkDocs ``site/`` output does not rely on any.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
