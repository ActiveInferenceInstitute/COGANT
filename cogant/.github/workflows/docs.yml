# Build and deploy the MkDocs site. Repository root must be the COGANT package root
# (directory containing mkdocs.yml and docs/). For a monorepo, add working-directory.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Action versions track ../../../.github/workflows/AGENTS.md (setup-uv has no
# floating major tag, so it is pinned to an exact release).
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          prune-cache: true
      - name: Build site
        run: uv run --with mkdocs-material --with 'mkdocstrings[python]' mkdocs build
      # upload-pages-artifact v4+ leaves dotfiles out of the Pages tarball by
      # default; the MkDocs ``site/`` output does not rely on any.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
