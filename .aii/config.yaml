repo:
  name: COGANT
  slug: cogant
  full_name: ActiveInferenceInstitute/COGANT
  description: Codebase-to-GNN translation engine. The installable package is the nested
    cogant/ tree (py/cogant, its own tests, pyproject.toml and Rust PyO3 crates) and
    the manuscript lives under manuscript/; top-level src/, tests/ and pyproject.toml
    form a small compatibility shell for the parent docxology/template project
    discovery contract.
