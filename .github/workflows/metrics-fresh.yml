name: METRICS.yaml freshness gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so check_metrics_fresh.py can diff against the recorded
      # ``generator_git_sha``; all git calls are local, so drop the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ``prune-cache: true`` restores the pre-v9 setup-uv default.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: cogant
        run: uv sync --all-extras

      - name: Check METRICS.yaml is not out-of-sync
        working-directory: cogant
        run: uv run python ../tools/check_metrics_fresh.py
