name: METRICS.yaml freshness gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    steps:
      # Full history so check_metrics_fresh.py can diff against the recorded
      # ``generator_git_sha``; all git calls are local, so drop the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.11"
          working-directory: cogant
          enable-cache: "true"

      - name: Install dependencies
        working-directory: cogant
        run: uv sync --all-extras

      - name: Check METRICS.yaml is not out-of-sync
        working-directory: cogant
        run: uv run python ../tools/check_metrics_fresh.py
