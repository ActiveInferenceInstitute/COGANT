name: Performance smoke

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 6am UTC
  workflow_dispatch:

# upload-artifact authenticates with the runner's artifact token, so the
# repository token only needs read access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: Graph-build benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: cogant
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.11"
          working-directory: cogant
          enable-cache: "true"

      - name: Install all extras
        run: uv sync --extra all

      - name: Run graph-build benchmark
        run: uv run python benchmarks/bench_graph_build.py 2>&1 | tee perf_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: cogant/perf_results.txt
          retention-days: 90
