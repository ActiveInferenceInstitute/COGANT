name: Performance smoke

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 6am UTC
  workflow_dispatch:

# upload-artifact authenticates with the runner's artifact token, so the
# repository token only needs read access.
permissions:
  contents: read

jobs:
  perf:
    name: Graph-build benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cogant
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # ``prune-cache: true`` restores the pre-v9 setup-uv default.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install all extras
        run: uv sync --extra all

      - name: Run graph-build benchmark
        run: uv run python benchmarks/bench_graph_build.py 2>&1 | tee perf_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf_results.txt
          retention-days: 90
