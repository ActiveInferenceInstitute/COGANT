name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every CI job only reads the repository. Annotations from
# ``--output-format=github`` need no extra token scope.
permissions:
  contents: read

defaults:
  run:
    working-directory: cogant

jobs:
  # One job, one environment install: every repository fact gate that only
  # needs the dev environment runs through ``../run_gate.py``, which is also
  # the entry point a developer uses locally. The commands exist in the gate,
  # never in this file.
  static:
    name: Static gates (lint, content, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Full history: check_metrics_fresh.py verifies that METRICS.yaml's
        # ``generator_git_sha`` is an ancestor of HEAD; a shallow checkout
        # (default depth 1) cannot walk ancestry on the PR merge ref, so the
        # gate fails with "not an ancestor of HEAD" even when METRICS is in
        # sync. Every git call in CI is local (rev-parse/status/diff/ls-files),
        # so the token is not left behind for later steps.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        # The org standard's composite action installs the pinned uv release
        # and the CPython interpreter in one step.
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.11"
          working-directory: cogant
          enable-cache: "true"

      - name: Lint, content, and docs gates
        # ``--prepare`` performs the single ``uv sync`` for the union of these
        # arms' extras (dev). Previously each check family had its own job and
        # its own install; mypy keeps its own job below so its check-run name
        # stays stable.
        run: python ../run_gate.py --prepare lint content docs

  typecheck:
    name: Typecheck (mypy)
    # Kept as its own job so the mypy check-run name stays stable for branch
    # protection, but the command itself lives only in ``run_gate.py types``.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.11"
          working-directory: cogant
          enable-cache: "true"

      - name: Run mypy (strict)
        run: python ../run_gate.py --prepare types

  test:
    # No explicit ``name:``: matrix context in ``jobs.<job_id>.name`` only
    # expands for jobs that actually RUN — while the job is skipped (e.g.
    # ``needs: static`` failing) GitHub renders the raw ``${{ matrix.* }}``
    # expression literally in the UI. Dropping the name lets GitHub apply
    # its default matrix naming (``test (3.11)`` …), which renders the
    # expanded python version in both skipped and executed states.
    runs-on: ubuntu-latest
    # The 3.11 leg runs the full suite with the coverage gate; 3.12–3.14 run
    # the fast arm. Each leg installs once and invokes pytest once: the
    # previous 3.11 leg ran the suite three times (fast, property, coverage).
    timeout-minutes: 90
    needs: static
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: cogant
          enable-cache: "true"

      - name: Fast tests
        if: matrix.python-version != '3.11'
        run: python ../run_gate.py --prepare test-fast

      - name: Full tests with coverage gate
        if: matrix.python-version == '3.11'
        # Coverage gate raised from 75% to 89% to align with ``pyproject.toml``
        # ``[tool.pytest.ini_options].addopts.--cov-fail-under=89``. The
        # manuscript-reported headline number is the *measured* value on the
        # canonical run; the gate floor (89%) preserves a small margin so
        # coverage fluctuations don't turn CI red on a real refactor.
        run: python ../run_gate.py --prepare test-full

  rust-build:
    name: Rust backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ``actions-rs/*`` is immutable (Node 12, last released 2020); use the
      # community-maintained ``dtolnay/rust-toolchain`` action which is the
      # de-facto replacement and runs on the modern Node runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cogant/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cogant/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust fmt, check, test, clippy
        run: python3 ../run_gate.py rust

  clean-wheel:
    name: Clean wheel install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.12"
          working-directory: cogant
          enable-cache: "true"

      - name: Wheel smoke and release integrity
        # ``tools/wheel_smoke.py`` is the repository's existing clean-wheel
        # helper (also ``make wheel-smoke``): it builds a wheel with ``uv
        # build``, installs it into a fresh venv, imports the public modules
        # and instantiates every parser. The audit then rebuilds the wheel
        # twice and compares bytes.
        run: python ../run_gate.py --prepare wheel

  gnn-conformance:
    name: gnn conformance (pinned)
    # The upstream checkout stays out of the ``all`` extra, but this lane is
    # the stable conformance check for every pull request and push. It keeps
    # the same bounded, job-local cache and remains available from the Actions
    # UI through ``workflow_dispatch``. The full manual pipeline is still
    # reachable through ``cogant upstream-gnn`` and
    # ``cogant analyze --upstream-gnn-pipeline``; this job exercises the
    # selected parse/type-check/validation steps and the bridge tests.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The gate also sets this for its ``uv sync``; pinning it at job level
      # keeps the probe and bridge tests on the same job-local cache and
      # cannot evict the core dependency cache.
      UV_CACHE_DIR: /tmp/cogant-upstream-uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        # Caching stays off here so this lane cannot hide its provenance.
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.12"
          working-directory: cogant
          enable-cache: "false"

      - name: Pinned upstream conformance
        # Probe (``cogant/scripts/gnn_conformance_probe.py``) + bridge tests +
        # provenance audit; the same arm runs locally as
        # ``python run_gate.py gnn``.
        run: python ../run_gate.py --prepare gnn

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.11"
          working-directory: cogant
          enable-cache: "true"

      # The composite action installs uv and CPython into uv's managed store;
      # the seeded environment puts that interpreter on PATH as `python` for
      # the pip install of pre-commit below.
      - name: Create the pinned Python environment
        run: |
          uv venv --seed --python 3.11 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"

      # Inline ``pip install pre-commit`` rather than using
      # ``pre-commit/action`` because that action still bundles
      # ``actions/cache@v4`` (Node 20). Running pre-commit directly
      # keeps the whole job on the modern runtime.
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('cogant/.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py3.11-

      - name: Run pre-commit
        # Ruff hooks were removed from the config: ``run_gate.py lint`` is the
        # single ruff invocation for both CI and local runs. metrics-freshness
        # needs uv and is enforced by the content arm.
        env:
          SKIP: metrics-freshness
        run: pre-commit run --config cogant/.pre-commit-config.yaml --all-files --show-diff-on-failure
