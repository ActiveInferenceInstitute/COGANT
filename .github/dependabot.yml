version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # The installable package lives at cogant/ with its own pyproject.toml and
  # uv.lock; track that dependency surface separately from the compatibility shell.
  - package-ecosystem: "pip"
    directory: "/cogant"
    schedule:
      interval: "weekly"
    groups:
      cogant-pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
